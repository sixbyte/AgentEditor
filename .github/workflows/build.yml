name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: xcodebuild -scheme AgentEditor -configuration Debug -derivedDataPath "$RUNNER_TEMP/AgentEditorDerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Test
        run: xcodebuild -scheme AgentEditor -configuration Debug -derivedDataPath "$RUNNER_TEMP/AgentEditorDerivedData" CODE_SIGNING_ALLOWED=NO test
