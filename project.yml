name: AgentEditor
options:
  bundleIdPrefix: com.agenteditor
  minimumXcodeGenVersion: 2.45.0
  developmentLanguage: en
  xcodeVersion: "15.0"
  projectFormat: xcode15_0
  deploymentTarget:
    macOS: "14.0"
targets:
  AgentEditor:
    type: application
    platform: macOS
    sources:
      - AgentEditor
      - path: Templates
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agenteditor.app
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
  AgentEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AgentEditorTests
    dependencies:
      - target: AgentEditor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
